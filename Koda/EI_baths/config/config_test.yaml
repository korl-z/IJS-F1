    nt: 200
    min_ratio: 0.03
    max_ratio: 2.0

  continuation:
    d_floor_frac: 0.1


open_system:
  bath:
    rate: rate_product
    pars:
      wc: .inf
      kap: [0.3, 0.6, 0.3]
      mu: 1.

  solve:
    dt: 0.8
    td: 0.3
    tm: 0.3
    tol: 5.0e-5
    nmax: 20000
    chk: 20
    prog: false

ratio_sweep:
  x0: 0.9
  r_min: 1.0
  r_max: 3.0
  r_step: 0.2