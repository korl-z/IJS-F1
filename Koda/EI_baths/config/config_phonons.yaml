model:
  nk:
    scan: 40
    reference: 50

  band:
    name: tb_2d
    pars: &band
      gap: 2.0
      ta: 1.0
      tb: -1.0

  mean_field: &mf
    v: 4.4
    n: 1.0
    uh: null


equilibrium:
  initial:
    t: 0.0
    d: 1.0
    m: 0.0

  solve:
    mix: [0.3, 0.3]
    tol: 1.0e-8
    nmax: 20000
    chk: 20
    prog: false

  critical:
    tlo: 1.0e-4
    thi: 2.0
    tol: 1.0e-7
    nmax: 100
    prog: true


scan:
  temperature:
    nt: 10
    min_ratio: 0.01
    max_ratio: 3.0
  t1: {min_ratio: 0.05, max_ratio: 1.5, nt: 12}
  t2: {min_ratio: 0.05, max_ratio: 7.0, nt: 16}

  continuation:
    d_floor_frac: 0.1


open_system:
  # bath:
    # rate: PhononBath
    # pars:
      # <<: [*band, *mf]   # gap, ta, tb and v, n, uh (zadnji trije za settanje em)

      # amp: 1.0
      # dip: 2.0

      # cs: 10.0
      # w0: 2.2
      # gam: 0.15

      # nsub: 32  # 0: line at the grid points, > 0: avg., idealno nsub>= 4pi cs /(gam * nk) 
  bath:
    rate: PhononBath
    pars:  # shared by all baths, pack needs equal k, a0, eh, em, nsub
      <<: [*band, *mf]   # gap, ta, tb and v, n, uh (zadnji trije za settanje em)
      # gam: 0.15
      nsub: 8  # 0: line at the grid points, > 0: avg., idealno nsub >= 4pi cs / (gam * nk) for the largest cs

    baths:  # one entry per temperature (T1, T2), merged over pars
      - kind: photon
        amp: 1.0
        dip: 0.1
        cs: 20.0
        w0: 2.0
        gam: 0.2

      # - kind: photon
        # amp: 0.044
        # dip: 2.0
        # cs: 10.0
        # w0: 0.1

      - kind: phonon
        amp: 0.0001
        dip: 0.0        # fononi nimajo offdiag clenov
        ta_prime: -10.0     # t'_a
        tb_prime: 10.0      # t'_b
        cs: 0.3
        w0: 1.0e-6      # acoustic
        gam: 0.1

  solve:
    dt: 0.03
    td: 100.
    tm: 100.
    tol: 1.0e-6
    nmax: 20000
    chk: 100
    prog: false
    mode: dense
    block: 128